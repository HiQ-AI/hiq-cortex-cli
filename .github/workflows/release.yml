# Build and publish native CLI archives directly to the owned CDN.
name: release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-cdn:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Verify reviewed main checkout
        run: node .github/scripts/verify-release.mjs
      - run: npm ci
      - run: npm test
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/querying-lca-datasets-test-config
      - run: ./scripts/build-binaries.sh
      - name: Verify five native archives before publication
        run: node scripts/check-native.mjs dist-bin
      - name: Publish immutable versioned CDN objects
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DOWNLOAD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DOWNLOAD_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          DOWNLOAD_S3_BUCKET: ${{ secrets.DOWNLOAD_S3_BUCKET }}
        run: ./scripts/publish-cdn.sh dist-bin
      - name: Record the source version
        id: version
        run: node -e "const fs=require('node:fs');fs.appendFileSync(process.env.GITHUB_OUTPUT,'version='+JSON.parse(fs.readFileSync('package.json')).version+'\n')"

  verify-install:
    needs: publish-cdn
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.publish-cdn.outputs.version }}
    steps:
      - name: Install exact CDN release on macOS/Linux
        if: runner.os != 'Windows'
        run: |
          export QUERYING_LCA_DATASETS_INSTALL="$RUNNER_TEMP/querying-lca-datasets-bin"
          export HOME="$RUNNER_TEMP/querying-lca-datasets-home"
          export XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$HOME"
          curl -fsSL "https://download.hiq.earth/cli/querying-lca-datasets/releases/v$RELEASE_VERSION/install.sh" | sh
          actual=$("$QUERYING_LCA_DATASETS_INSTALL/querying-lca-datasets" version)
          test "$actual" = "$RELEASE_VERSION"
      - name: Install exact CDN release on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QUERYING_LCA_DATASETS_INSTALL = "$env:RUNNER_TEMP\querying-lca-datasets-bin"
          $env:USERPROFILE = "$env:RUNNER_TEMP\querying-lca-datasets-home"
          $env:HOME = $env:USERPROFILE
          $env:XDG_CONFIG_HOME = "$env:HOME\.config"
          New-Item -ItemType Directory -Path $env:HOME -Force | Out-Null
          irm "https://download.hiq.earth/cli/querying-lca-datasets/releases/v$env:RELEASE_VERSION/install.ps1" | iex
          $actual = & "$env:QUERYING_LCA_DATASETS_INSTALL\querying-lca-datasets.exe" version
          if ($actual.Trim() -ne $env:RELEASE_VERSION) { throw "Unexpected native version: $actual" }
