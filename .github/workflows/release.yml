# Distribute the renamed CLI as five self-contained binaries, not an npm package.
# Keep the verified private draft handoff and immutable GitHub asset checks.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release

# Transfer drafts are never published or overwritten. Keep them for failed-job
# reruns; see .github/RELEASE-HANDOFF.md for the reviewed manual cleanup policy.
# Producer attempt and manifest hash travel through job outputs, so a consumer-only
# rerun still reads the original producer rather than a candidate from a newer run.
jobs:
  # Runs on macOS because only a Mac can codesign the Darwin binaries; Bun
  # cross-compiles the Linux and Windows targets from here just as well.
  binaries:
    runs-on: macos-latest
    outputs:
      release_id: ${{ steps.handoff.outputs.release_id }}
      attempt: ${{ steps.handoff.outputs.attempt }}
      manifest_sha256: ${{ steps.handoff.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Verify exact version tag and main ancestry
        run: node .github/scripts/verify-release.mjs
      # Resolve the same locked dependencies used by source tests.
      - run: npm ci
      - run: ./scripts/build-binaries.sh
      - name: Check five target architectures and isolated native diagnostics
        run: node scripts/check-native.mjs dist-bin
      - name: Stage binaries in a private draft Release
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-handoff.mjs upload binaries dist-bin

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node .github/scripts/verify-release.mjs
      - run: npm ci
      - run: npm test
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/lca-background-data-test-config
      - name: Verify and retrieve binaries from the producer draft
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSFER_ID: ${{ needs.binaries.outputs.release_id }}
          TRANSFER_ATTEMPT: ${{ needs.binaries.outputs.attempt }}
          TRANSFER_MANIFEST_SHA256: ${{ needs.binaries.outputs.manifest_sha256 }}
        run: node .github/scripts/release-handoff.mjs download binaries dist-bin
      - name: Create or verify immutable GitHub binary Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-publish.mjs dist-bin/*

  # 国内直连 GitHub 不通,CDN 才是用户实际走的下载源 —— 跟着发布一起推,
  # 不能等人想起来手动跑,否则 install.sh 会一直装到旧版本。
  mirror-cdn:
    needs: release
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.DOWNLOAD_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DOWNLOAD_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      DOWNLOAD_S3_BUCKET: ${{ secrets.DOWNLOAD_S3_BUCKET }}
      DOWNLOAD_CF_DIST_ID: ${{ secrets.DOWNLOAD_CF_DIST_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/mirror-to-cdn.sh "$GITHUB_REF_NAME"

  # Exercise CDN installers against this exact version, not a moving latest.
  verify-install:
    needs: mirror-cdn
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # 装的是 CDN 上那一份 —— 用户复制粘贴的就是这一行,连同镜像是否推上去
      # 一起验;跑仓里的副本只能证明脚本本身没写错。
      - name: install.sh (version-pinned CDN)
        if: runner.os != 'Windows'
        env:
          LCA_BACKGROUND_DATA_BASE_URL: https://download.hiq.earth/cli/lca-background-data/releases/${{ github.ref_name }}
        run: |
          export LCA_BACKGROUND_DATA_INSTALL="$RUNNER_TEMP/lca-background-data-bin"
          export HOME="$RUNNER_TEMP/lca-background-data-home"
          export XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$HOME"
          curl -fsSL https://download.hiq.earth/cli/lca-background-data/install.sh | sh
          actual=$("$LCA_BACKGROUND_DATA_INSTALL/lca-background-data" version)
          test "$actual" = "${GITHUB_REF_NAME#v}"
      - name: install.ps1 (version-pinned CDN)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LCA_BACKGROUND_DATA_BASE_URL: https://download.hiq.earth/cli/lca-background-data/releases/${{ github.ref_name }}
        run: |
          $env:LCA_BACKGROUND_DATA_INSTALL = "$env:RUNNER_TEMP\lca-background-data-bin"
          $env:USERPROFILE = "$env:RUNNER_TEMP\lca-background-data-home"
          $env:HOME = $env:USERPROFILE
          $env:XDG_CONFIG_HOME = "$env:HOME\.config"
          New-Item -ItemType Directory -Path $env:HOME -Force | Out-Null
          irm https://download.hiq.earth/cli/lca-background-data/install.ps1 | iex
          $actual = & "$env:LCA_BACKGROUND_DATA_INSTALL\lca-background-data.exe" version
          if ($actual.Trim() -ne $env:GITHUB_REF_NAME.TrimStart('v')) { throw "Unexpected native version: $actual" }
